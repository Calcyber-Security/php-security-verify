ServerRoot /etc/apache2
DefaultRuntimeDir /tmp/apache
PidFile /tmp/apache/httpd.pid
Listen 8080
ServerName localhost
LoadModule mpm_prefork_module /usr/lib/apache2/modules/mod_mpm_prefork.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule php7_module /usr/lib/apache2/modules/libphp7.so
User www-data
Group www-data
DocumentRoot /tmp/www
DirectoryIndex index.php
<Directory /tmp/www>
    Require all granted
    AllowOverride None
</Directory>
<Directory /tmp/www/limited>
    php_admin_value max_multipart_body_parts 2
</Directory>
<Directory /tmp/www/session>
    php_admin_flag session.upload_progress.cleanup Off
</Directory>
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>
ErrorLog /proc/self/fd/2
LogLevel warn
StartServers 1
MinSpareServers 1
MaxSpareServers 1
ServerLimit 1
MaxRequestWorkers 1
MaxConnectionsPerChild 0
Timeout 20
KeepAlive Off
EnableSendfile Off
php_admin_value memory_limit 8M
php_admin_value post_max_size 32M
php_admin_value max_input_vars 1000
php_admin_flag display_errors On
php_admin_flag display_startup_errors On
php_admin_flag html_errors Off
php_admin_flag log_errors On
php_admin_value error_log /proc/self/fd/2
php_admin_flag session.use_cookies On
php_admin_flag session.use_strict_mode Off
php_admin_flag session.upload_progress.enabled On
php_admin_value session.save_path /tmp
